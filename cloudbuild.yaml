# ============================================================================
# Pipeline de Cloud Build: build de la imagen -> push a Artifact Registry ->
# deploy a Cloud Run (1 instancia siempre encendida + bucket montado por FUSE).
#
# Multi-container service: Next.js generator (ingress) + FastAPI editor (sidecar).
# The two containers communicate over localhost (127.0.0.1) and exchange files
# via a shared in-memory volume (/shared). Durable outputs use the existing
# GCS bucket mounted via FUSE.
#
# Uso manual:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_BUCKET=mi-bucket,_REGION=us-central1
#
# CI/CD desde GitHub: crear un trigger de Cloud Build apuntando a este archivo
# (Cloud Build > Triggers > Connect repository). Cada push a la rama buildea y deploya.
#
# Ajustá las _SUBSTITUTIONS (sobre todo _BUCKET) a tu proyecto.
# ============================================================================
substitutions:
  _REGION: us-central1            # region de Cloud Run / Artifact Registry
  _SERVICE: augc-pipeline         # nombre del servicio Cloud Run
  _REPO: augc                     # repo de Artifact Registry (docker)
  _BUCKET: CAMBIAME-bucket-gcs    # bucket de Cloud Storage a montar (storage del proyecto)
  _VERTEX_LOCATION: us-central1   # region de Vertex AI (GOOGLE_CLOUD_LOCATION)

steps:
  # 1) Build generator image (Next.js).
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2) Build editor sidecar image (FastAPI).
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-editor:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-editor:latest
      - ./editor

  # 3) Push generator image to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 4) Push editor sidecar image to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-editor

  # 5) Deploy multi-container Cloud Run service.
  #    - 1 sola instancia (la cola de jobs vive en memoria del proceso).
  #    - CPU siempre asignada (--no-cpu-throttling) para que el "pump" siga corriendo.
  #    - Volumen GCS montado en /mnt/gcs -> OUTPUT_DIR/DATA_DIR apuntan ahi.
  #    - Shared emptyDir volume (/shared) for generator ↔ editor I/O exchange.
  #    - Editor sidecar: internal-only (localhost:8000), not exposed to ingress.
  #    - Auth de Vertex: automatica via la service account del servicio (ADC).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=1
      - --max-instances=1
      - --cpu=4
      - --memory=8Gi
      - --no-cpu-throttling
      - --port=8080
      - --timeout=3600
      - --set-env-vars=PROVIDER_MODE=vertex,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION},OUTPUT_DIR=/mnt/gcs/output,DATA_DIR=/mnt/gcs/data,EDIT_MODE=cloud,SHARED_VOLUME_PATH=/shared,EDITOR_BASE_URL=http://127.0.0.1:8000
      - --add-volume=name=gcsvol,type=cloud-storage,bucket=${_BUCKET}
      - --add-volume-mount=volume=gcsvol,mount-path=/mnt/gcs
      - --add-volume=name=shared,type=in-memory,size-limit=2Gi
      - --add-volume-mount=volume=shared,mount-path=/shared
      # Editor sidecar container
      - --container=editor
      - --container-image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-editor:$SHORT_SHA
      - --container-port=8000
      - --container-env=VSE_STORAGE_BACKEND=volume,EDIT_MODE=cloud,SHARED_VOLUME_PATH=/shared
      - --container-volume-mount=volume=shared,mount-path=/shared
      - --container-volume-mount=volume=gcsvol,mount-path=/mnt/gcs
      - --depends-on=editor
      # OJO: --allow-unauthenticated deja la app PUBLICA en internet. Como dispara
      # generaciones que CUESTAN dinero (Veo/Gemini), considera restringir el acceso
      # (ver guia de deploy). Para una app privada, cambia a --no-allow-unauthenticated.
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-editor:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-editor:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
